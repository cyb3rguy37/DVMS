<!--shared page layout-->
<!DOCTYPE html>
<html>
<head>
    <title>Digital Visitor Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/dashboard">DVMS</a>
        
        <div class="navbar-nav">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/register-visitor" data-roles="guard,admin">Register</a>
            <a class="nav-link" href="/search-visitor" data-roles="guard,admin">Search</a>
            <a class="nav-link" href="/active-visitors" data-roles="guard,admin">Active</a>
            <a class="nav-link" href="/checkout-visitor" data-roles="guard,admin">Checkout</a>
            <a class="nav-link" href="/reports" data-roles="admin">Reports</a>
            <a class="nav-link" href="/audit-verify" data-roles="admin">Audit</a>
            <a class="nav-link" href="/retention" data-roles="admin">Retention</a>
            <a class="nav-link" href="/create-user" data-roles="admin">Users</a>
        </div>
        <button class="btn btn-danger btn-sm ms-auto" onclick="logout()">Logout</button>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
    <script>
        requireLogin();
        applyRoleNavigation();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
