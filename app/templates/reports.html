{% extends "base.html" %}

{% block content %}

<h2>Reports Dashboard</h2>

<p class="text-muted">
    Summary statistics for visitor activity.
</p>

<div id="message"></div>

<button class="btn btn-dark mb-3" onclick="loadReport()">
    Refresh Report
</button>

<div class="row">

    <div class="col-md-4 mb-3">
        <div class="card p-3 text-center">
            <h5>Total Visits</h5>
            <h2 id="totalVisits">0</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card p-3 text-center">
            <h5>Active Visits</h5>
            <h2 id="activeVisits">0</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card p-3 text-center">
            <h5>Checked Out</h5>
            <h2 id="checkedOutVisits">0</h2>
        </div>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
requireLogin();

async function loadReport() {
    const response = await fetch("/reports/summary", {
        headers: {
            "Authorization": "Bearer " + getToken()
        }
    });

    const data = await response.json();

    if (!response.ok) {
        showMessage("message", "danger", data.detail || "Failed to load report.");
        return;
    }

    document.getElementById("totalVisits").innerText = data.total_visits;
    document.getElementById("activeVisits").innerText = data.active_visits;
    document.getElementById("checkedOutVisits").innerText = data.checked_out_visits;

    showMessage("message", "success", "Report loaded successfully.");
}

loadReport();
</script>
{% endblock %}
